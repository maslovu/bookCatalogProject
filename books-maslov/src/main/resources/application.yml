spring:
  datasource:
    url: jdbc:postgresql://postgres-service:5432/otus
#    url: jdbc:postgresql://localhost:5432/otus
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 1800000
      connection-timeout: 30000

  liquibase:
    default-schema: public
    change-log: classpath:changelog/db-master-changelog.xml
    database-change-log-lock-table: DATABASECHANGELOGLOCK
  kafka:
#    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
#      host: localhost
      host: redis-service
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      jedis:
        pool:
          max-active: 10

  cache:
    type: redis
    redis:
      time-to-live: 600000 # TTL 10 минут (пример)


  jpa:
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
        ddl-auto: none

  ai:
    ollama:
      base-url: http://host.docker.internal:11434
      chat:
        options:
          model: llama3
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        table-name: book_embeddings
        dimensions: 768
        initialize-schema: false

management:
  server:
    port: 8082 # <-- ВСЕ эндпоинты Actuator уйдут на внутренний порт 8082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
